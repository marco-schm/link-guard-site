# Keeps the commit-pinned GitHub Actions in .github/workflows current.
# The site has no dependencies besides Python 3; fonts and logo are
# vendored in src/, so no other ecosystem is listed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
